<title>Svenska varje dag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column (max 720px) — a sticky header with level + streak, tab nav, a single working view.
   Colour: Baltic ink on a cool birch-paper ground, saffron (lussekatt) for the one highlight, sea-blue for actions. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #e8edf2;
  --fg: #14212e;
  --muted: #5a6876;
  --line: #d3dbe3;
  --accent: #1f5f99;
  --accent-fg: #ffffff;
  --accent-soft: #dce9f5;
  --sun: #e2a100;
  --sun-soft: #fbefcc;
  --good: #2f7d4f;
  --good-soft: #dcf0e3;
  --bad: #b23a3a;
  --bad-soft: #f8e0e0;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1720; --surface: #17222e; --surface-2: #1f2d3b; --fg: #e6edf3; --muted: #93a3b3; --line: #2a3a4a;
    --accent: #6aa8e0; --accent-fg: #0b1622; --accent-soft: #1b3248; --sun: #f2bd3a; --sun-soft: #3a3016;
    --good: #6cc191; --good-soft: #17352a; --bad: #e98a8a; --bad-soft: #3d1f22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1720; --surface: #17222e; --surface-2: #1f2d3b; --fg: #e6edf3; --muted: #93a3b3; --line: #2a3a4a;
  --accent: #6aa8e0; --accent-fg: #0b1622; --accent-soft: #1b3248; --sun: #f2bd3a; --sun-soft: #3a3016;
  --good: #6cc191; --good-soft: #17352a; --bad: #e98a8a; --bad-soft: #3d1f22; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px 0; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand-mark { width: 22px; height: 16px; border-radius: 3px; background: var(--accent); position: relative; overflow: hidden; flex: none; }
.brand-mark::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 4px; background: var(--sun); }
.brand-mark::after { content: ""; position: absolute; top: 6px; left: 0; right: 0; height: 4px; background: var(--sun); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); font-size: 0.82rem; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.level { background: var(--accent-soft); color: var(--accent); }
.chip.streak { background: var(--sun-soft); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; width: 100%; padding-top: 8px; }
nav.tabs a { padding: 8px 12px; color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--sun); }
nav.tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }

main.wrap { padding-block: 22px 64px; display: grid; gap: 18px; }

/* Building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.stack { display: grid; gap: 10px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sv { font-family: var(--font-display); font-size: 1.12rem; font-weight: 500; }
.big-sv { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; line-height: 1.3; }

button, .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 9px 16px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 10px; }
button.ghost:hover { color: var(--fg); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.icon { padding: 7px; width: 36px; height: 36px; justify-content: center; }
button.mic { background: var(--surface-2); }
button.mic.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.mic.on { background: var(--bad); border-color: var(--bad); color: #fff; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--bad) 25%, transparent); } }
@media (prefers-reduced-motion: reduce) { button.mic.on { animation: none; } }
body[data-nomic] .mic, body[data-nospeech] .speak, body[data-nospeech] .needs-speech { display: none !important; }

textarea, input[type="text"], select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; width: 100%; }
textarea { resize: vertical; min-height: 70px; }
select { width: auto; }
.interim { color: var(--muted); font-style: italic; min-height: 1.4em; }

.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: var(--surface-2); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.sun { background: var(--sun-soft); }
.note { padding: 10px 14px; border-radius: var(--r-sm); background: var(--sun-soft); font-size: 0.9rem; }
.note.err { background: var(--bad-soft); color: var(--bad); }
.hidden-text { filter: blur(6px); user-select: none; cursor: pointer; }
body[data-nospeech] .hidden-text { filter: none; user-select: auto; }
.speaking-bar { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; box-shadow: 0 4px 18px rgb(0 0 0 / 0.18); }
.thinking { color: var(--muted); font-style: italic; }
.thinking::after { content: "…"; animation: dots 1.2s steps(3) infinite; display: inline-block; width: 1em; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0; } to { width: 1em; } }

/* Today */
.plan { display: grid; gap: 10px; }
.plan-step { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); }
.plan-step .ico { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); font-size: 1.1rem; }
.plan-step.done { opacity: 0.6; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.ladder span { text-align: center; padding: 6px 0; border-radius: 6px; background: var(--surface-2); font-weight: 600; font-size: 0.85rem; color: var(--muted); }
.ladder span.reached { background: var(--accent-soft); color: var(--accent); }
.ladder span.current { background: var(--accent); color: var(--accent-fg); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week div { text-align: center; font-size: 0.75rem; color: var(--muted); display: grid; gap: 4px; justify-items: center; }
.week i { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); display: block; }
.week i.on { background: var(--sun); }

/* Topics */
.topics { display: flex; flex-wrap: wrap; gap: 8px; }
.topic { border-radius: 999px; padding: 8px 14px; font-weight: 500; }
.topic small { color: var(--muted); font-weight: 400; margin-left: 4px; }

/* Conversation */
.chat { display: grid; gap: 12px; }
.bubble { max-width: 88%; padding: 12px 14px; border-radius: 16px; display: grid; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.bubble.them { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; justify-self: start; }
.bubble.me { background: var(--accent-soft); border-bottom-right-radius: 4px; justify-self: end; }
.bubble .tools { display: flex; gap: 2px; justify-content: flex-end; margin: -4px -6px -6px 0; }
.bubble .tools button { padding: 4px 8px; font-size: 0.85rem; border: none; background: transparent; color: var(--muted); }
.bubble .tools button:hover { color: var(--fg); }
.glossable .w { cursor: pointer; border-radius: 4px; transition: background .12s; }
.glossable .w:hover { background: var(--accent-soft); }
.glossable .w.on { background: var(--sun-soft); box-shadow: 0 0 0 2px var(--sun-soft); }
.glossable.hidden-text .w { cursor: inherit; }
.gloss { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 8px; font-size: 0.92rem; }
.gloss-word { display: grid; gap: 4px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-2); }
.gloss-word .row button { padding: 4px 8px; font-size: 0.85rem; }
.fix { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 4px; font-size: 0.92rem; }
.fix .right { color: var(--good); font-weight: 600; }
.composer { position: sticky; bottom: 0; background: var(--bg); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: grid; gap: 8px; }
.timer { font-variant-numeric: tabular-nums; }

/* Evaluation, lists */
.list { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.list li { padding: 10px 12px; background: var(--surface-2); border-radius: var(--r-sm); display: grid; gap: 2px; min-width: 0; }
.wrong { text-decoration: line-through; text-decoration-color: var(--bad); color: var(--muted); }
.right-txt { color: var(--good); font-weight: 600; }

/* Listening */
.line { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.spk { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; background: var(--accent-soft); color: var(--accent); }
.spk.B { background: var(--sun-soft); color: var(--fg); }
.line.playing { background: color-mix(in srgb, var(--sun-soft) 60%, transparent); border-radius: 8px; }

/* Review */
.flash { text-align: center; padding: 28px 18px; display: grid; gap: 14px; justify-items: center; }
.progressbar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progressbar i { display: block; height: 100%; background: var(--sun); transition: width .3s; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 500; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 480px) {
  h1 { font-size: 1.45rem; }
  .bubble { max-width: 96%; }
  .card { padding: 14px; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Svenska varje dag</div>
    <span class="chip level" id="hdr-level" hidden></span>
    <span class="chip streak" id="hdr-streak" hidden></span>
    <nav class="tabs" aria-label="Bereiche">
      <a href="#today">Heute</a>
      <a href="#talk">Gespräch</a>
      <a href="#listen">Hören</a>
      <a href="#speak">Nachsprechen</a>
      <a href="#review">Wiederholen</a>
      <a href="#progress">Fortschritt</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite">
  <div class="card"><p class="thinking">Lade deine Daten</p></div>
</main>
<script type="module" src="js/app.js"></script>
